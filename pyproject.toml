[project]
name = "lazy-object-proxy"
description = "A fast and thorough lazy object proxy."
requires-python = ">=3.11"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Ionel Cristian Mărieș", email = "contact@ionelmc.ro" },
]
keywords = [
    # eg: "keyword1", "keyword2", "keyword3",
]
classifiers = [
    # complete classifier list: http://pypi.python.org/pypi?%3Aaction=list_classifiers
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    # uncomment if you test on these interpreters:
    # "Programming Language :: Python :: Implementation :: IronPython",
    # "Programming Language :: Python :: Implementation :: Jython",
    # "Programming Language :: Python :: Implementation :: Stackless",
    "Topic :: Utilities",
]
dependencies = []
dynamic = [
    "readme",
    "version",
]

[project.urls]
"Changelog" = "https://python-lazy-object-proxy.readthedocs.io/en/latest/changelog.html"
"Documentation" = "https://python-lazy-object-proxy.readthedocs.io/"
"Issue Tracker" = "https://github.com/ionelmc/python-lazy-object-proxy/issues"
"Sources" = "https://github.com/ionelmc/python-lazy-object-proxy"

[project.optional-dependencies]
# rst = ["docutils>=0.11"]

[dependency-groups]
benchmark = [
    "Django",
    "objproxies==0.9.4",
    "pytest-benchmark",
    "wrapt==2.0.0",
]
test = [
    "pytest",
]

[build-system]
requires = [
    "setuptools>=80",
    "setuptools_scm>=8",
]
build-backend = "setuptools.build_meta"

[tool.ruff]
extend-exclude = ["static", "ci/templates"]
line-length = 140
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "RUF001",  # ruff-specific rules ambiguous-unicode-character-string
    "RUF061",  # Use context-manager form of `pytest.raises()`
    "S101",  # flake8-bandit assert
    "S308",  # flake8-bandit suspicious-mark-safe-usage
    "E501",  # pycodestyle line-too-long
    "DTZ001",
    "PT011",
    "PT012",
    "B004",
    "S102",
    "PLC0415",
]
select = [
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "E",  # pycodestyle errors
    "EXE",  # flake8-executable
    "F",  # pyflakes
    "I",  # isort
    "INT",  # flake8-gettext
    "PIE",  # flake8-pie
    "PLC",  # pylint convention
    "PLE",  # pylint errors
    "PT",  # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RSE",  # flake8-raise
    "RUF",  # ruff-specific rules
    "S",  # flake8-bandit
    "UP",  # pyupgrade
    "W",  # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"ci/*" = ["S"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
forced-separate = ["conftest"]
force-single-line = true

[tool.ruff.format]
quote-style = "single"

[tool.setuptools.dynamic]
readme = { file = ["README.rst"] }

[tool.setuptools_scm]
local_scheme = "dirty-tag"
write_to = "src/lazy_object_proxy/_version.py"
fallback_version = "1.13.0"
