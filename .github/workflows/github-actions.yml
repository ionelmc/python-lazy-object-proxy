            python: '3.15t'
            python_arch: 'x64'
            tox_env: 'py315t-nocov'
            cibw_arch: 'x86_64'
            cibw_build: 'cp315t-*musllinux*'
            cibw_ft: 'true'
            os: 'ubuntu-latest'
          - name: 'py315t-nocov (ubuntu/aarch64/manylinux)'
            artifact: 'py315t-ubuntu-aarch64-manylinux'
            python: '3.15t'
            python_arch: 'x64'
            tox_env: 'py315t-nocov'
            cibw_arch: 'aarch64'
            cibw_build: 'cp315t-*manylinux*'
            cibw_ft: 'true'
            os: 'ubuntu-latest'
          - name: 'py315t-nocov (ubuntu/aarch64/musllinux)'
            artifact: 'py315t-ubuntu-aarch64-musllinux'
            python: '3.15t'
            python_arch: 'x64'
            tox_env: 'py315t-nocov'
            cibw_arch: 'aarch64'
            cibw_build: 'cp315t-*musllinux*'
            cibw_ft: 'true'
            os: 'ubuntu-latest'
          - name: 'py315t-nocov (ubuntu/riscv64/manylinux)'
            artifact: 'py315t-ubuntu-riscv64-manylinux'
            python: '3.15t'
            python_arch: 'x64'
            tox_env: 'py315t-nocov'
            cibw_arch: 'riscv64'
            cibw_build: 'cp315t-*manylinux*'
            cibw_ft: 'true'
            os: 'ubuntu-latest'
          - name: 'py315t-nocov (ubuntu/riscv64/musllinux)'
            artifact: 'py315t-ubuntu-riscv64-musllinux'
            python: '3.15t'
            python_arch: 'x64'
            tox_env: 'py315t-nocov'
            cibw_arch: 'riscv64'
            cibw_build: 'cp315t-*musllinux*'
            cibw_ft: 'true'
            os: 'ubuntu-latest'
          - name: 'py315t-nocov (windows/AMD64)'
            artifact: 'py315t-windows-AMD64'
            python: '3.15t'
            python_arch: 'x64'
            tox_env: 'py315t-nocov'
            cibw_arch: 'AMD64'
            cibw_build: 'cp315t-*'
            cibw_ft: 'true'
            os: 'windows-latest'
          - name: 'py315t-nocov (windows/ARM64)'
            artifact: 'py315t-windows-ARM64'
            python: '3.15t'
            python_arch: 'arm64'
            tox_env: 'py315t-nocov'
            cibw_arch: 'ARM64'
            cibw_build: 'cp315t-*'
            cibw_ft: 'true'
            os: 'windows-11-arm'
          - name: 'py315t-nocov (macos/arm64)'
            artifact: 'py315t-macos-arm64'
            python: '3.15t'
            python_arch: 'arm64'
            tox_env: 'py315t-nocov'
            cibw_arch: 'arm64'
            cibw_build: 'cp315t-*'
            cibw_ft: 'true'
            os: 'macos-latest'
          - name: 'pypy311-cover (ubuntu/x86_64)'
            artifact: 'pypy311-ubuntu-x86_64'
            python: 'pypy-3.11'
            python_arch: 'x64'
            tox_env: 'pypy311-cover'
            cover: true
            cibw_arch: 'x86_64'
            cibw_build: false
            os: 'ubuntu-latest'
          - name: 'pypy311-nocov (ubuntu/x86_64/manylinux)'
            artifact: 'pypy311-ubuntu-x86_64-manylinux'
            python: 'pypy-3.11'
            python_arch: 'x64'
            tox_env: 'pypy311-nocov'
            cibw_arch: 'x86_64'
            cibw_build: false
            os: 'ubuntu-latest'
          - name: 'pypy312-cover (ubuntu/x86_64)'
            artifact: 'pypy312-ubuntu-x86_64'
            python: 'pypy-3.12'
            python_arch: 'x64'
            tox_env: 'pypy312-cover'
            cover: true
            cibw_arch: 'x86_64'
            cibw_build: false
            os: 'ubuntu-latest'
          - name: 'pypy312-nocov (ubuntu/x86_64/manylinux)'
            artifact: 'pypy312-ubuntu-x86_64-manylinux'
            python: 'pypy-3.12'
            python_arch: 'x64'
            tox_env: 'pypy312-nocov'
            cibw_arch: 'x86_64'
            cibw_build: false
            os: 'ubuntu-latest'
    steps:
    - uses: docker/setup-qemu-action@v3
      if: matrix.cibw_arch == 'aarch64'
      with:
        platforms: arm64
    - uses: docker/setup-qemu-action@v3
      if: matrix.cibw_arch == 'riscv64'
      with:
        platforms: riscv64
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v7
      if: matrix.cibw_build
      with:
        # for cibuildwheel 3.x
        python-version: 3.11
    - name: install dependencies (cibw)
      if: matrix.cibw_build
      run: |
        python -mpip install --progress-bar=off cibuildwheel -r ci/requirements.txt
    - name: install dependencies (gdb)
      if: >
        !matrix.cibw_build && matrix.os == 'ubuntu'
      run: >
        sudo apt-get install gdb
    - name: install dependencies (regular)
      if: >
        !matrix.cibw_build
      run: |
        python -mpip install --progress-bar=off -r ci/requirements.txt
    - name: list dependencies
      run: |
        python -VV
        virtualenv --version
        pip --version
        tox --version
        pip list --format=freeze
    - name: cibw build and test
      if: matrix.cibw_build
      run: cibuildwheel
      env:
        CIBW_ARCHS: '${{ matrix.cibw_arch }}'
        CIBW_BUILD: '${{ matrix.cibw_build }}'
        CIBW_CONTAINER_ENGINE: "docker; create_args: --cap-add=SYS_PTRACE"
        CIBW_BUILD_VERBOSITY: '3'
        CIBW_TEST_REQUIRES: >
          tox
        CIBW_TEST_COMMAND: >
          cd {project} &&
          tox --installpkg {wheel} -e ${{ matrix.tox_env }} -vv
        CIBW_TEST_COMMAND_WINDOWS: >
          cd /d {project} &&
          tox --installpkg {wheel} -e ${{ matrix.tox_env }} -vv
    - uses: actions/setup-python@v7
      if: >
        !matrix.cibw_build
      with:
        python-version: ${{ matrix.python }}
        architecture: ${{ matrix.python_arch }}
    - name: regular build and test
      if: >
        !matrix.cibw_build
      run: >
        tox -e ${{ matrix.tox_env }} -vv
    - name: check wheel
      if: >
        !matrix.cibw_ft && matrix.cibw_build
      run: |
        python -mpip install --progress-bar=off twine
        twine check wheelhouse/*.whl
    - name: upload wheel
      uses: actions/upload-artifact@v4
      if: matrix.cibw_build
      with:
        name: wheel-${{ matrix.artifact }}
        path: wheelhouse/*.whl
    - uses: coverallsapp/github-action@v2
      if: matrix.cover
      continue-on-error: true
      with:
        flag-name: ${{ matrix.name }}
        parallel: true
    - uses: codecov/codecov-action@v7
      if: matrix.cover
      with:
        flags: ${{ matrix.name }}
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
  finish:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/upload-artifact/merge@v6
      with:
        name: all-wheels
    - uses: coverallsapp/github-action@v2
      with:
        parallel-finished: true
