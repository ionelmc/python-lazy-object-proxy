      fail-fast: false
      matrix:
        include:
          - name: 'check'
            python: '3.13'
            tox_env: 'check'
            os: 'ubuntu-latest'
          - name: 'docs'
            python: '3.13'
            tox_env: 'docs'
            os: 'ubuntu-latest'
          - name: 'py311-cover (ubuntu/x86_64)'
            artifact: 'py311-ubuntu-x86_64'
            python: '3.11'
            python_arch: 'x64'
            tox_env: 'py311-cover'
            cover: true
            cibw_arch: 'x86_64'
            cibw_build: false
            os: 'ubuntu-latest'
          - name: 'py311-nocov (ubuntu/x86_64/manylinux)'
